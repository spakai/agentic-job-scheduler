<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title description">
<title id="title">ADR 1: Kafka retains pending work</title>
<desc id="description">Implemented backlog model · offsets belong to a consumer group, topic and partition</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#52647a"/></marker></defs>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#182b43} .heading {font-size:25px;font-weight:700} .label {font-size:19px;font-weight:700} .detail {font-size:17px} .small {font-size:15px;fill:#42556c} .line {fill:none;stroke:#52647a;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1120" height="570" rx="16" fill="white"/>
<text x="36" y="44" class="heading" text-anchor="start">ADR 1 · Kafka retains pending work</text>
<text x="36" y="75" class="detail" text-anchor="start">Implemented backlog model · offsets belong to a consumer group, topic and partition</text>
<rect x="36" y="130" width="210" height="105" rx="12" fill="#edf5ff" stroke="#bdcbd9"/>
<text x="141.0" y="175.5" class="label" text-anchor="middle">Job producer</text>
<text x="141.0" y="202.5" class="detail" text-anchor="middle">Key = jobId</text>
<rect x="320" y="130" width="390" height="105" rx="12" fill="#edf5ff" stroke="#bdcbd9"/>
<text x="515.0" y="175.5" class="label" text-anchor="middle">Kafka topic records</text>
<text x="515.0" y="202.5" class="detail" text-anchor="middle">Durable until retention removes them</text>
<rect x="784" y="130" width="300" height="105" rx="12" fill="#edf5ff" stroke="#bdcbd9"/>
<text x="934.0" y="175.5" class="label" text-anchor="middle">Worker</text>
<text x="934.0" y="202.5" class="detail" text-anchor="middle">Queues and gates in memory</text>
<path d="M246 182 H318" class="line"/>
<text x="282" y="168" class="small" text-anchor="middle">Publish</text>
<path d="M710 182 H782" class="line"/>
<text x="747" y="168" class="small" text-anchor="middle">Consume</text>
<rect x="320" y="310" width="390" height="100" rx="12" fill="#eff8f4" stroke="#bdcbd9"/>
<text x="515.0" y="353.0" class="label" text-anchor="middle">Committed next offset</text>
<text x="515.0" y="380.0" class="detail" text-anchor="middle">Resume here after restart</text>
<path d="M934 235 V360 H712" class="line"/>
<text x="870" y="285" class="small" text-anchor="middle">Safe-prefix commit</text>
<path d="M515 310 V237" class="line" stroke-dasharray="6 4"/>
<text x="635" y="282" class="small" text-anchor="middle">Replay uncommitted work</text>
<rect x="36" y="470" width="1048" height="82" rx="12" fill="#f3f5f8" stroke="#bdcbd9"/>
<text x="560" y="498" class="detail" text-anchor="middle">A crash discards local state; Kafka can replay work whose offsets were not committed.</text>
<text x="560" y="524" class="detail" text-anchor="middle">Replay can repeat successful effects or handoffs. Retention can expire unfinished work.</text>
</svg>
