<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title description">
<title id="title">ADR 4: Commit only the completed prefix</title>
<desc id="description">Option A is selected and implemented · example for one consumer group, topic and partition</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#52647a"/></marker></defs>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#182b43} .heading {font-size:25px;font-weight:700} .label {font-size:19px;font-weight:700} .detail {font-size:17px} .small {font-size:15px;fill:#42556c} .line {fill:none;stroke:#52647a;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1120" height="660" rx="16" fill="white"/>
<text x="36" y="44" class="heading" text-anchor="start">ADR 4 · Commit only the completed prefix</text>
<text x="36" y="75" class="detail" text-anchor="start">Option A is selected and implemented · example for one consumer group, topic and partition</text>
<text x="45" y="134" class="label" text-anchor="start">Delivered offsets</text>
<rect x="325" y="105" width="235" height="72" rx="12" fill="#fff4df" stroke="#bdcbd9"/>
<text x="442.5" y="147.5" class="label" text-anchor="middle">10 · running</text>
<rect x="575" y="105" width="235" height="72" rx="12" fill="#eff8f4" stroke="#bdcbd9"/>
<text x="692.5" y="147.5" class="label" text-anchor="middle">11 · complete</text>
<rect x="825" y="105" width="235" height="72" rx="12" fill="#eff8f4" stroke="#bdcbd9"/>
<text x="942.5" y="147.5" class="label" text-anchor="middle">12 · complete</text>
<text x="45" y="217" class="label" text-anchor="start">Safe next offset: 10</text>
<text x="325" y="217" class="detail" text-anchor="start">Finishing 11 and 12 does not authorize skipping unfinished 10.</text>
<path d="M440 242 V280" class="line"/>
<text x="600" y="263" class="small" text-anchor="middle">Offset 10 completes</text>
<rect x="325" y="282" width="735" height="74" rx="12" fill="#eff8f4" stroke="#bdcbd9"/>
<text x="692.5" y="312.0" class="label" text-anchor="middle">Now propose next offset 13</text>
<text x="692.5" y="339.0" class="detail" text-anchor="middle">Retained entries release after the broker acknowledges the commit</text>
<rect x="36" y="391" width="508" height="132" rx="12" fill="#fff4df" stroke="#bdcbd9"/>
<text x="58" y="422" class="label" text-anchor="start">Option B · rejected</text>
<text x="58" y="451" class="detail" text-anchor="start">Commit on receipt, without durable admission</text>
<text x="58" y="482" class="detail" text-anchor="start">Crash can leave accepted work unrecoverable.</text>
<rect x="564" y="391" width="520" height="132" rx="12" fill="#f3f5f8" stroke="#bdcbd9"/>
<text x="586" y="422" class="label" text-anchor="start">Option C · NOT IMPLEMENTED</text>
<text x="586" y="451" class="detail" text-anchor="start">Durable database inbox, then Kafka commit</text>
<text x="586" y="482" class="detail" text-anchor="start">Requires a new spec and verified EDR semantics.</text>
<rect x="36" y="560" width="1048" height="82" rx="12" fill="#f3f5f8" stroke="#bdcbd9"/>
<text x="560" y="588" class="detail" text-anchor="middle">Commits use the next offset; delivered offset gaps are allowed.</text>
<text x="560" y="614" class="detail" text-anchor="middle">The current service has no database inbox or EDR recovery path.</text>
</svg>
