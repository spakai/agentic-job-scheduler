<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title description">
<title id="title">ADR 2: Start as soon as execution is permitted</title>
<desc id="description">Intended dispatch policy · waiting for capacity is backpressure, not a scheduled delay</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#52647a"/></marker></defs>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#182b43} .heading {font-size:25px;font-weight:700} .label {font-size:19px;font-weight:700} .detail {font-size:17px} .small {font-size:15px;fill:#42556c} .line {fill:none;stroke:#52647a;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1120" height="570" rx="16" fill="white"/>
<text x="36" y="44" class="heading" text-anchor="start">ADR 2 · Start as soon as execution is permitted</text>
<text x="36" y="75" class="detail" text-anchor="start">Intended dispatch policy · waiting for capacity is backpressure, not a scheduled delay</text>
<rect x="36" y="135" width="250" height="105" rx="12" fill="#edf5ff" stroke="#bdcbd9"/>
<text x="161.0" y="180.5" class="label" text-anchor="middle">Validated record</text>
<text x="161.0" y="207.5" class="detail" text-anchor="middle">No eligibility timestamp</text>
<rect x="376" y="135" width="365" height="105" rx="12" fill="#edf5ff" stroke="#bdcbd9"/>
<text x="558.5" y="180.5" class="label" text-anchor="middle">Queue head + free gate</text>
<text x="558.5" y="207.5" class="detail" text-anchor="middle">AND execution capacity?</text>
<rect x="833" y="135" width="251" height="105" rx="12" fill="#eff8f4" stroke="#bdcbd9"/>
<text x="958.5" y="194.0" class="label" text-anchor="middle">Start handler</text>
<path d="M286 187 H374" class="line"/>
<path d="M741 187 H831" class="line"/>
<text x="787" y="173" class="small" text-anchor="middle">Yes</text>
<rect x="376" y="325" width="365" height="100" rx="12" fill="#fff4df" stroke="#bdcbd9"/>
<text x="558.5" y="368.0" class="label" text-anchor="middle">Keep waiting</text>
<text x="558.5" y="395.0" class="detail" text-anchor="middle">Retain the source record</text>
<path d="M558 240 V323" class="line"/>
<text x="580" y="286" class="small" text-anchor="middle">No</text>
<path d="M376 375 H332 V210 H374" class="line" stroke-dasharray="6 4"/>
<text x="191" y="360" class="small" text-anchor="middle">Recheck on state change</text>
<rect x="36" y="470" width="1048" height="82" rx="12" fill="#f3f5f8" stroke="#bdcbd9"/>
<text x="560" y="498" class="detail" text-anchor="middle">Retry workers additionally require their independent start-rate permission.</text>
<text x="560" y="524" class="detail" text-anchor="middle">Client scheduledAt and notBefore fields are rejected; no delayed-job timer exists.</text>
</svg>
