services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  main-worker-a:
    build: .
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      WORKER_ROLE: "main"
      WORKER_CONCURRENCY: "${MAIN_WORKER_A_CONCURRENCY:-16}"
      KAFKA_TOPIC_PARTITIONS: "${KAFKA_TOPIC_PARTITIONS:-12}"
      WORKER_MAX_RETAINED_RECORDS: "${WORKER_MAX_RETAINED_RECORDS:-250}"
      WORKER_PRESSURE_DEPENDENCIES: "demo-rest,demo-db"
      WORKER_ADAPTIVE_SLOW_LATENCY_ENABLED: "${WORKER_ADAPTIVE_SLOW_LATENCY_ENABLED:-true}"
      WORKER_ADAPTIVE_EXTERNAL_PRESSURE_ENABLED: "${WORKER_ADAPTIVE_EXTERNAL_PRESSURE_ENABLED:-true}"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  main-worker-b:
    build: .
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      WORKER_ROLE: "main"
      WORKER_CONCURRENCY: "${MAIN_WORKER_B_CONCURRENCY:-8}"
      KAFKA_TOPIC_PARTITIONS: "${KAFKA_TOPIC_PARTITIONS:-12}"
      WORKER_MAX_RETAINED_RECORDS: "${WORKER_MAX_RETAINED_RECORDS:-250}"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  http-api:
    build: .
    entrypoint:
      - "java"
      - "-cp"
      - "/app/app.jar:/app/dependency/*"
      - "com.example.agenticjobscheduler.admission.HttpApiMain"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC_PARTITIONS: "${KAFKA_TOPIC_PARTITIONS:-12}"
      REGISTERED_JOB_TYPES: "${REGISTERED_JOB_TYPES:-demo.echo}"
      HTTP_PORT: "8080"
      HTTP_MAX_BODY_BYTES: "262144"
      HTTP_MAX_IN_FLIGHT: "1000"
      HTTP_ACK_DEADLINE_MILLIS: "10000"
      KAFKA_DELIVERY_TIMEOUT_MILLIS: "9000"
      HTTP_GRACEFUL_SHUTDOWN_MILLIS: "30000"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    stop_grace_period: 35s
    restart: unless-stopped

  sample-producer:
    build: .
    profiles: ["tools"]
    entrypoint: ["java", "-cp", "/app/app.jar:/app/dependency/*", "com.example.agenticjobscheduler.runtime.SampleProducerMain"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC_PARTITIONS: "${KAFKA_TOPIC_PARTITIONS:-12}"
      DEMO_HANDLER_DELAY_MILLIS: "${DEMO_HANDLER_DELAY_MILLIS:-100}"
      DEMO_EXTERNAL_RESPONSE: "${DEMO_EXTERNAL_RESPONSE:-none}"
      DEMO_RUN_ID: "${DEMO_RUN_ID:-}"
      DEMO_RANDOM_SEED: "${DEMO_RANDOM_SEED:-1200}"
      DEMO_HTTP_BASE_URL: "${DEMO_HTTP_BASE_URL:-http://http-api:8080}"
      DEMO_HTTP_TIMEOUT_MILLIS: "${DEMO_HTTP_TIMEOUT_MILLIS:-15000}"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
