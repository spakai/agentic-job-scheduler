services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  main-worker:
    build: .
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      WORKER_ROLE: "main"
      WORKER_CONCURRENCY: "${MAIN_WORKER_CONCURRENCY:-16}"
      KAFKA_TOPIC_PARTITIONS: "${KAFKA_TOPIC_PARTITIONS:-12}"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  retry-worker:
    build: .
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      WORKER_ROLE: "retry"
      WORKER_CONCURRENCY: "${RETRY_WORKER_CONCURRENCY:-2}"
      KAFKA_TOPIC_PARTITIONS: "${KAFKA_TOPIC_PARTITIONS:-12}"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  sample-producer:
    build: .
    profiles: ["tools"]
    entrypoint: ["java", "-cp", "/app/app.jar:/app/dependency/*", "com.example.agenticjobscheduler.runtime.SampleProducerMain"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC_PARTITIONS: "${KAFKA_TOPIC_PARTITIONS:-12}"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
